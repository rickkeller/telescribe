[project]
name = "telescribe"
version = "0.1.0"
description = "Local-first Telegram Desktop JSON daily archiver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
  "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
telescribe = "telescribe.cli:app"

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
